# Fedora 44 checks for raccoonix-t2. The jobs run inside fedora:44.
# rpmbuild and rpmlint run here because a checkout may not have them.

name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    name: Python tests and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test and build on Fedora 44
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:Z" \
            -w /src \
            fedora:44 \
            bash -euxo pipefail -c '
              dnf -y install --setopt=install_weak_deps=False \
                python3 python3-devel python3-pip gcc
              python3 -m pip install --disable-pip-version-check build
              PYTHONPATH=python/src python3 -m unittest discover -s python/tests -v
              python3 -m build --wheel python
            '

  rust:
    name: Rust fmt, clippy, tests, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check on Fedora 44
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:Z" \
            -w /src \
            fedora:44 \
            bash -euxo pipefail -c '
              dnf -y install --setopt=install_weak_deps=False \
                rust cargo rustfmt clippy gcc
              cargo fmt --manifest-path rust/t2offsec-inventory/Cargo.toml -- --check
              cargo clippy --manifest-path rust/t2offsec-inventory/Cargo.toml --locked --all-targets -- -D warnings
              cargo test --manifest-path rust/t2offsec-inventory/Cargo.toml --locked
              cargo build --manifest-path rust/t2offsec-inventory/Cargo.toml --locked --release
            '

  rpm:
    name: RPM build and rpmlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack the GitHub-shaped source archive
        run: |
          mkdir -p "$RUNNER_TEMP/rpmbuild/SOURCES"
          git archive --format=tar.gz --prefix=t2refit-0.1.0/ \
            -o "$RUNNER_TEMP/rpmbuild/SOURCES/t2refit-0.1.0.tar.gz" HEAD
      - name: Build and lint on Fedora 44
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:Z" \
            -v "$RUNNER_TEMP/rpmbuild:/rpmbuild:Z" \
            -w /src \
            fedora:44 \
            bash -euxo pipefail -c '
              dnf -y install --setopt=install_weak_deps=False \
                rpm-build rpmlint python3-devel python3-pip python3-setuptools \
                rust cargo gcc binutils make
              rpmbuild -ba packaging/raccoonix-t2.spec --define "_topdir /rpmbuild"
              rpmlint packaging/raccoonix-t2.spec /rpmbuild/RPMS/*/*.rpm /rpmbuild/SRPMS/*.rpm
            '
