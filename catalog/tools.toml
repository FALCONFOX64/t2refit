# SPDX-License-Identifier: Apache-2.0
# Source of truth for the Fedora offensive-lab workspace.
# fedora = "official" was in the Fedora 44 compose according to mdapi on 2026-10-16.
# fedora = "copr" was not in that compose; copr names a project that had a build that day.
# fedora = "upstream" has no official Fedora 44 package. Build from the upstream project.
# License is the upstream project license, not every bundled-library tag in a Fedora spec.

[meta]
fedora_release = "44"
checked = "2026-10-16"
kali_meta = "https://www.kali.org/tools/kali-meta/"

[[groups]]
id = "recon"
title = "Recon"
kali_metapackages = ["kali-tools-information-gathering", "kali-tools-identify"]
summary = """
Name the hosts, DNS names, and services on a network you are allowed to test. This covers Kali's information-gathering menu and the identify menu's scanners that have a Fedora path.
"""

[[groups]]
id = "web"
title = "Web"
kali_metapackages = ["kali-tools-web"]
summary = """
Check a web application you are allowed to test: content discovery, header and TLS review, and the scanners Kali ships for that menu.
"""

[[groups]]
id = "vuln"
title = "Vulnerability checks"
kali_metapackages = ["kali-tools-vulnerability"]
summary = """
Match known issues and review local hardening. These rows are scanners and benchmarks. They do not describe how to exploit a finding.
"""

[[groups]]
id = "wireless"
title = "Wireless"
kali_metapackages = ["kali-tools-802-11", "kali-tools-wireless"]
summary = """
802.11 tools from Kali's wireless menus. On the reference MacBookPro16,1 the built-in BCM4364 is a station interface (observed, docs/hardware-scan.md). Use a separate adapter for wireless lab work. Monitor mode on this host was not tested (open).
"""

[[groups]]
id = "bluetooth"
title = "Bluetooth"
kali_metapackages = ["kali-tools-bluetooth"]
summary = """
Bluetooth utilities. This host's controller is powered on and the patch file BCM.hcd is missing (observed, docs/hardware-scan.md). Do not download firmware from this repo. Use a separate adapter for Bluetooth lab work.
"""

[[groups]]
id = "passwords"
title = "Passwords"
kali_metapackages = ["kali-tools-passwords", "kali-tools-gpu"]
summary = """
Offline recovery and online login checks for hashes and accounts you are authorized to test. Hashcat is also Kali's practical GPU tool on Fedora. Kali's password menu additionally ships Windows credential-dump binaries; those are not listed.
"""

[[groups]]
id = "exploitation"
title = "Exploitation frameworks"
kali_metapackages = ["kali-tools-exploitation"]
summary = """
Frameworks that hold public exploit modules. Each row names the project and how to get it onto Fedora. Modules, payloads, and commands are out of scope.
"""

[[groups]]
id = "tunnels"
title = "Tunnels and proxies"
kali_metapackages = ["kali-tools-post-exploitation"]
summary = """
Proxies and relays from Kali's post-exploitation menu that Fedora already packages as ordinary network tools. Implant kits, webshell collections, and credential-dump binaries from that menu are not listed.
"""

[[groups]]
id = "social"
title = "Social engineering"
kali_metapackages = ["kali-tools-social-engineering"]
summary = """
Names of the two frameworks Kali highlights for this menu. Campaign steps are not documented.
"""

[[groups]]
id = "sniff"
title = "Sniffing"
kali_metapackages = ["kali-tools-sniffing-spoofing"]
summary = """
Capture and review traffic on a segment you are allowed to monitor.
"""

[[groups]]
id = "database"
title = "Databases"
kali_metapackages = ["kali-tools-database"]
summary = """
Clients for database files and lab database servers. sqlmap is listed under Web and cross-referenced here.
"""

[[groups]]
id = "forensics"
title = "Forensics"
kali_metapackages = ["kali-tools-forensics", "kali-tools-recover", "kali-tools-respond"]
summary = """
Disk, file, and artifact examination after you already have an image or a file. This is also the Fedora-side home for Kali's recover and respond menus.
"""

[[groups]]
id = "reversing"
title = "Reverse engineering"
kali_metapackages = ["kali-tools-reverse-engineering"]
summary = """
Disassemble and inspect binaries you are allowed to examine.
"""

[[groups]]
id = "fuzzing"
title = "Fuzzing"
kali_metapackages = ["kali-tools-fuzzing"]
summary = """
Feed unexpected input to a local program under test. wfuzz is listed under Web and cross-referenced here.
"""

[[groups]]
id = "crypto"
title = "Crypto and stego"
kali_metapackages = ["kali-tools-crypto-stego"]
summary = """
Steganography and small crypto helpers from Kali's crypto-stego menu.
"""

[[groups]]
id = "sdr"
title = "Software-defined radio"
kali_metapackages = ["kali-tools-sdr"]
summary = """
Radio software for a lab radio you own.
"""

[[groups]]
id = "rfid"
title = "RFID"
kali_metapackages = ["kali-tools-rfid"]
summary = """
RFID research tools. Kali's RFID menu also depends on GNU Radio, which is listed under software-defined radio.
"""

[[groups]]
id = "voip"
title = "VoIP"
kali_metapackages = ["kali-tools-voip"]
summary = """
SIP test tools. Nmap and tshark are cross-referenced from their own groups.
"""

[[groups]]
id = "detect"
title = "Detection and hardening"
kali_metapackages = ["kali-tools-detect", "kali-tools-protect"]
summary = """
Host and network detection. This is the Fedora path for Kali's detect and protect menus. Zeek and Snort were retired from Fedora, so they are upstream pointers.
"""

[[groups]]
id = "reporting"
title = "Reporting"
kali_metapackages = ["kali-tools-reporting"]
summary = """
Screenshots, notes, and report platforms. The Fedora package ghostwriter is a Markdown editor. SpecterOps Ghostwriter is a different project, listed under AI and report helpers.
"""

[[groups]]
id = "lab"
title = "Lab and VMs"
kali_metapackages = ["kali-linux-labs"]
summary = """
Local virtual machines and containers so a lab stays off the daily-driver network. This is the Fedora match for Kali's lab metapackage.
"""

[[groups]]
id = "hardware"
title = "Bench hardware"
kali_metapackages = ["kali-tools-hardware"]
summary = """
Serial consoles, flash programmers, and on-chip debug for a bench. These are not T2 drivers. Keyboard, Wi-Fi, audio, Touch Bar, and the Secure Enclave stay with the projects named in docs/gap-analysis.md.
"""

[[groups]]
id = "windows"
title = "Windows resources"
kali_metapackages = ["kali-tools-windows-resources"]
summary = """
Kali's windows-resources metapackage is a set of Windows binaries, including credential tools and packers. This repo does not ship, mirror, or document them. To reach a Windows VM you own, use FreeRDP and Remmina in the lab group.
"""

[[groups]]
id = "top10"
title = "Kali top 10"
kali_metapackages = ["kali-tools-top10"]
summary = """
Kali's ten highlighted tools, as a cross-reference. Each tool's install path is on its own row.
"""

[[groups]]
id = "ai"
title = "AI assistants and report helpers"
kali_metapackages = []
summary = """
Local model runners and report platforms for a lab notebook. They draft and format text you already have. They are not attack agents, and this repo does not document jailbreaks.
"""

