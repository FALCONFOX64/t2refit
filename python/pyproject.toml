[project]
name = "t2offsec"
version = "0.1.0"
description = "Read-only catalog browser shipped as the raccoonix-t2 Fedora package"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "t2refit contributors" }]

[project.scripts]
t2offsec = "t2offsec.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
