[package]
name = "t2offsec-inventory"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Read-only install and version inventory for the t2refit offensive catalog"
publish = false

[dependencies]
# Pinned for the repo's Rust 1.83 toolchain. Newer releases need edition 2024.
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
toml = "=0.8.19"
indexmap = "=2.2.6"
